<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rurouni Kenshin — Battousai's Wrath</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e08;font-family:'Courier New',monospace;
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9bbc0f;
  touch-action:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;box-shadow:0 0 60px rgba(155,188,15,.15);border-radius:4px;overflow:hidden;
  width:min(800px,100vw);aspect-ratio:800/480}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;background:rgba(10,14,8,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;z-index:30}
.ov h1{font-size:clamp(28px,6vw,42px);color:#9bbc0f;text-shadow:0 0 10px rgba(155,188,15,.4);letter-spacing:3px}
.ov h2{font-size:clamp(14px,3vw,18px);color:#8bac0f}
.ov p{font-size:clamp(10px,2vw,12px);max-width:560px;line-height:1.6;color:#768b00;opacity:.9}
.key{display:inline-block;background:#0a0e08;border:1px solid #306230;border-radius:3px;
  padding:1px 6px;font-weight:bold;color:#9bbc0f;margin:1px;font-size:clamp(9px,1.5vw,11px)}
.btn{margin-top:8px;font-size:clamp(14px,3vw,18px);font-weight:bold;padding:12px 36px;border:none;border-radius:6px;
  background:linear-gradient(180deg,#4a7a3a,#306230);color:#9bbc0f;cursor:pointer;letter-spacing:2px;
  font-family:'Courier New',monospace;box-shadow:0 4px 0 #1a3a14;min-width:180px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a3a14}
.hidden{display:none!important}
.grid{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:clamp(9px,1.5vw,11px);max-width:560px}
small{opacity:.5;font-size:clamp(9px,1.5vw,10px);color:#768b00}
#touchLayer{position:absolute;inset:0;z-index:20;pointer-events:none;display:none}
@media(hover:none)and(pointer:coarse){#touchLayer{display:block}}
.tb{position:absolute;pointer-events:auto;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-weight:bold;color:rgba(155,188,15,.75);
  background:rgba(48,98,48,.4);border:2px solid rgba(155,188,15,.3);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;transition:background .05s}
.tb.on{background:rgba(155,188,15,.45);border-color:rgba(155,188,15,.6)}
#bL{left:8px;bottom:8px;width:22%;height:28%;font-size:20px}
#bR{left:calc(22% + 16px);bottom:8px;width:22%;height:28%;font-size:20px}
#bJ{right:8px;bottom:calc(28% + 16px);width:22%;height:22%;font-size:12px}
#bA{right:calc(22% + 16px);bottom:calc(28% + 16px);width:22%;height:22%;font-size:12px}
#bS{right:8px;bottom:8px;width:22%;height:28%;font-size:11px}
#bP{right:8px;top:8px;width:40px;height:36px;font-size:18px;border-radius:6px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="title" class="ov">
    <h1>剣心</h1>
    <h2>RUROUNI KENSHIN — BATTOUSAI'S WRATH</h2>
    <p>A wandering swordsman with a reverse-blade sword fights for justice.
       Face waves of enemies. Every 5 waves, a boss awaits.</p>
    <div class="grid">
      <span><span class="key">←</span><span class="key">→</span> Move</span>
      <span><span class="key">Space</span> Jump</span>
      <span><span class="key">Z</span> Attack</span>
      <span><span class="key">X</span> Special</span>
      <span><span class="key">P</span> Pause</span>
    </div>
    <button class="btn" id="startBtn">⚔ ENTER — 開始 ⚔</button>
    <small>Touch controls on mobile</small>
  </div>
  <div id="winScreen" class="ov hidden">
    <h1>勝利 — VICTORY</h1>
    <h2 id="winSub"></h2>
    <button class="btn" id="winBtn">PLAY AGAIN ↺</button>
  </div>
  <div id="loseScreen" class="ov hidden">
    <h1 style="color:#62a030">散 — DEFEATED</h1>
    <h2 id="loseSub"></h2>
    <p id="loseStats"></p>
    <button class="btn" id="loseBtn">TRY AGAIN ↺</button>
  </div>
  <div id="touchLayer">
    <div id="bL" class="tb">◀</div>
    <div id="bR" class="tb">▶</div>
    <div id="bJ" class="tb">JUMP</div>
    <div id="bA" class="tb">ATK</div>
    <div id="bS" class="tb">SP</div>
    <div id="bP" class="tb">❚❚</div>
  </div>
</div>
<script>
"use strict";

var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var W = cv.width;
var H = cv.height;

// ── UTILS ──
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rint(a, b) { return Math.floor(rnd(a, b + 1)); }
function sign(v) { return v < 0 ? -1 : 1; }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function dst(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

// ── PALETTE ──
var PAL = {
  dark:'#0f380f', mid:'#306230', light:'#8bac0f', white:'#9bbc0f',
  red:'#c0392b', gi:'#e8e8e0', skin:'#d4c4a0', blade:'#c8d8e0',
  slash:'#9bbc0f', gold:'#c8a030', hp:'#62a030', hpBg:'#1a2a10',
  e1:'#8b4513', e2:'#623030', e3:'#4a5a30', e4:'#4a3060'
};

// ── SOUND ──
var Snd = (function() {
  var ac = null, master = null, muted = false;
  function ens() {
    if (ac) return;
    try {
      var A = window.AudioContext || window.webkitAudioContext;
      ac = new A();
      master = ac.createGain();
      master.gain.value = 0.35;
      master.connect(ac.destination);
    } catch(e) { ac = null; }
  }
  function res() { if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(f, d, o) {
    if (!ac || muted) return;
    o = o || {};
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    var g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.s) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.s), t + d);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(o.g || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + d + 0.02);
  }
  function noise(d, o) {
    if (!ac || muted) return;
    o = o || {};
    var n = Math.floor(ac.sampleRate * d);
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = ac.createBufferSource(); s.buffer = buf;
    var g = ac.createGain(); g.gain.value = o.g || 0.12;
    var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.hp || 1000;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  return {
    init: function() { ens(); res(); },
    jump: function() { ens(); res(); tone(440, 0.1, {type:'square',g:0.1,s:880}); },
    slash: function() { ens(); res(); noise(0.06,{g:0.18,hp:2000}); tone(300,0.08,{type:'sawtooth',g:0.1,s:150}); },
    special: function() { ens(); res(); tone(600,0.15,{type:'sawtooth',g:0.16,s:200}); noise(0.12,{g:0.18,hp:1500}); },
    hit: function() { ens(); res(); noise(0.07,{g:0.14,hp:1200}); tone(200,0.05,{type:'square',g:0.08}); },
    hurt: function() { ens(); res(); tone(220,0.12,{type:'sawtooth',g:0.16,s:80}); noise(0.07,{g:0.1,hp:600}); },
    kill: function() { ens(); res(); tone(150,0.15,{type:'square',g:0.14,s:50}); noise(0.1,{g:0.14,hp:800}); },
    wave: function() { ens(); res(); [600,800,1000,1200].forEach(function(f,i){ setTimeout(function(){tone(f,0.12,{type:'triangle',g:0.08});}, i*70); }); },
    boss: function() { ens(); res(); [200,250,300,200,250,350].forEach(function(f,i){ setTimeout(function(){tone(f,0.2,{type:'sawtooth',g:0.12});}, i*100); }); },
    pickup: function() { ens(); res(); [800,1000,1200].forEach(function(f,i){ setTimeout(function(){tone(f,0.08,{type:'triangle',g:0.1});}, i*50); }); },
    win: function() { ens(); res(); [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,0.25,{type:'triangle',g:0.14});}, i*110); }); },
    lose: function() { ens(); res(); [440,349,294,220].forEach(function(f,i){ setTimeout(function(){tone(f,0.3,{type:'square',g:0.14});}, i*140); }); },
    pause: function() { ens(); res(); tone(500,0.08,{type:'triangle',g:0.08}); }
  };
})();

// ── INPUT ──
var keys = {};
var tch = {left:false, right:false, jump:false, attack:false, special:false};

window.addEventListener('keydown', function(e) {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) !== -1) e.preventDefault();
  var k = e.key.toLowerCase();
  if (!keys[k]) {
    if (k === ' ' || k === 'w' || k === 'arrowup') doJump();
    if (k === 'z' || k === 'j') doAttack();
    if (k === 'x' || k === 'k') doSpecial();
    if (k === 'enter') handleStart();
    if (k === 'p') doPause();
  }
  keys[k] = true;
});
window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

function bindTouch(id, key, onFn) {
  var el = document.getElementById(id);
  if (!el) return;
  function onStart(e) { e.preventDefault(); e.stopPropagation(); tch[key] = true; el.classList.add('on'); if (onFn) onFn(); }
  function onEnd(e) { e.preventDefault(); e.stopPropagation(); tch[key] = false; el.classList.remove('on'); }
  el.addEventListener('touchstart', onStart, {passive:false});
  el.addEventListener('touchend', onEnd, {passive:false});
  el.addEventListener('touchcancel', onEnd);
  el.addEventListener('mousedown', onStart);
  el.addEventListener('mouseup', onEnd);
  el.addEventListener('mouseleave', onEnd);
}
bindTouch('bL', 'left', null);
bindTouch('bR', 'right', null);
bindTouch('bJ', 'jump', doJump);
bindTouch('bA', 'attack', doAttack);
bindTouch('bS', 'special', doSpecial);
bindTouch('bP', 'pause', doPause);

function isLeft() { return keys['a'] || keys['arrowleft'] || tch.left; }
function isRight() { return keys['d'] || keys['arrowright'] || tch.right; }

// ── GAME STATE ──
var gState = 'title';
var score = 0, wave = 0, lives = 3, hiScore = parseInt(localStorage.getItem('kenshinHi')) || 0;
var camX = 0, shake = 0, hitFreeze = 0;
var particles = [], floaters = [], pickups = [];
var player, enemies, platforms, waveCD, boss;
var GROUND = 400, WW = 3200;

// ── PLAYER ──
function mkPlayer() {
  return {
    x:120, y:GROUND-48, w:28, h:48, vx:0, vy:0, speed:3.5, facing:1,
    onGround:true, jumps:2, maxJumps:2, hp:100, maxHp:100,
    invuln:0, atkCD:0, state:'idle', stateT:0, animT:0,
    atkHit:false, atkFrame:0, combo:0, comboTimer:0,
    safeX:120, safeY:GROUND-48, kills:0, dmgTaken:0
  };
}

// ── ENEMIES ──
function mkEnemy(type, x) {
  var T = {
    thug:    {w:24,h:40,hp:2,spd:1.2,dmg:8,pts:50,col:PAL.e1},
    samurai: {w:26,h:44,hp:4,spd:1.8,dmg:12,pts:100,col:PAL.e2},
    archer:  {w:22,h:38,hp:2,spd:0.8,dmg:6,pts:75,col:PAL.e3},
    elite:   {w:30,h:48,hp:6,spd:2,dmg:15,pts:200,col:PAL.e4}
  };
  var t = T[type] || T.thug;
  return {
    type:type, x:x, y:GROUND-t.h, w:t.w, h:t.h,
    vx:(Math.random()<0.5?-1:1)*t.spd, vy:0,
    hp:t.hp, maxHp:t.hp, dmg:t.dmg, spd:t.spd, pts:t.pts, col:t.col,
    dead:false, hurt:0, animT:0, facing:1, atkCD:0,
    atkRange: type==='archer' ? 280 : 50,
    shootCD: type==='archer' ? 80+rint(0,30) : 0,
    arrowX:0, arrowY:0, arrowOn:false, arrowVx:0
  };
}

function mkBoss(x) {
  return {
    x:x, y:GROUND-64, w:40, h:64, vx:0, vy:0,
    hp:30, maxHp:30, dmg:18, pts:500,
    col:'#8b0000', dead:false, hurt:0, animT:0, facing:-1,
    atkCD:0, phase:1, stateT:0, name:'DRAGON HEAD ONI'
  };
}

// ── WAVES ──
function spawnWave() {
  wave++;
  Snd.wave();
  floaters.push({x:W/2+camX, y:H/2-50, t:80, text:'WAVE '+wave, col:PAL.white, big:true});
  if (wave % 5 === 0) { spawnBoss(); return; }
  var n = Math.min(3 + wave, 14);
  var types = ['thug','thug','samurai','archer','thug','elite'];
  for (var i = 0; i < n; i++) {
    var type = types[rint(0, Math.min(types.length-1, 1+Math.floor(wave/2)))];
    var x = player.x + rnd(300,900) * (Math.random()<0.5?1:-1);
    enemies.push(mkEnemy(type, clamp(x, 50, WW-100)));
  }
}

function spawnBoss() {
  boss = mkBoss(player.x + rnd(300,500) * (Math.random()<0.5?1:-1));
  boss.x = clamp(boss.x, 200, WW-200);
  Snd.boss();
  floaters.push({x:boss.x+20, y:boss.y-30, t:100, text:'BOSS: DRAGON HEAD ONI', col:PAL.red, big:true});
}

// ── LEVEL ──
function buildLevel() {
  platforms = [{x:0, y:GROUND, w:WW, h:H-GROUND, ground:true}];
  var plats = [[400,300,100],[650,260,80],[900,310,120],[1200,270,90],
    [1500,320,100],[1800,250,80],[2100,290,110],[2400,310,90],[2700,260,100]];
  plats.forEach(function(p) {
    platforms.push({x:p[0], y:p[1], w:p[2], h:12, float:true});
  });
}

function spawnPickup(x, y, type) {
  pickups.push({x:x, y:GROUND-16, w:12, h:12, type:type, animT:0,
    col: type==='hp' ? '#ff4444' : PAL.gold});
}

// ── DRAW BG ──
function drawBG() {
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f380f'); g.addColorStop(0.5,'#1a4a1a'); g.addColorStop(1,'#306230');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // Moon
  var mx = 680 - camX*0.05;
  ctx.fillStyle = 'rgba(155,188,15,.25)';
  ctx.beginPath(); ctx.arc(mx,80,40,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(155,188,15,.1)';
  ctx.beginPath(); ctx.arc(mx,80,55,0,7); ctx.fill();
  // Stars
  var at = player ? player.animT : 0;
  for (var i = 0; i < 30; i++) {
    var sx = (i*137+50) % W, sy = (i*89+20) % (GROUND-40);
    ctx.globalAlpha = 0.15 + (Math.sin(at/30+i)*0.5+0.5)*0.2;
    ctx.fillStyle = 'rgba(155,188,15,.3)'; ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha = 1;
  // Mountains
  ctx.fillStyle = '#1a3a1a';
  [[100,200,140],[400,160,110],[700,220,160],[1050,180,120],[1350,200,150]].forEach(function(m) {
    var x = m[0]-camX*0.15;
    ctx.beginPath(); ctx.moveTo(x,GROUND); ctx.lineTo(x+m[1]/2,GROUND-m[2]); ctx.lineTo(x+m[1],GROUND); ctx.closePath(); ctx.fill();
  });
  // Trees
  for (var i = 0; i < 16; i++) {
    var tx = i*200+(-camX*0.3%200), th = 40+(i*37%60);
    ctx.fillStyle = '#4a3a20'; ctx.fillRect(tx+14,GROUND-th-10,6,th);
    ctx.fillStyle = '#2a4a2a';
    ctx.beginPath(); ctx.arc(tx+17,GROUND-th-16,18,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(tx+8,GROUND-th-8,12,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(tx+26,GROUND-th-8,14,0,7); ctx.fill();
  }
  // Ground details
  ctx.fillStyle = '#1a3a14';
  for (var i = 0; i < 40; i++) {
    var gx = i*80+(-camX*0.6%80);
    if (i%3===0) { ctx.fillRect(gx,GROUND-4,3,6); ctx.fillRect(gx+5,GROUND-6,2,8); ctx.fillRect(gx+9,GROUND-3,3,5); }
    if (i%7===0) { ctx.fillStyle='#3a5a30'; ctx.fillRect(gx+2,GROUND-6,10,6); ctx.fillStyle='#1a3a14'; }
  }
  // Torii
  var gx2 = 1600+(-camX*0.25);
  ctx.fillStyle = PAL.red;
  ctx.fillRect(gx2,GROUND-140,8,140); ctx.fillRect(gx2+80,GROUND-140,8,140);
  ctx.fillRect(gx2-8,GROUND-140,104,10); ctx.fillRect(gx2-4,GROUND-128,96,6);
}

// ── DRAW PLAYER ──
function drawPlayer() {
  var p = player, x = p.x, y = p.y, f = p.facing;
  var blink = p.invuln > 0 && Math.floor(p.invuln/3) % 2;
  if (blink) ctx.globalAlpha = 0.4;
  if (p.state === 'hurt' && Math.floor(p.stateT/2)%2) ctx.globalAlpha = 0.3;
  var run = p.state === 'run' && p.onGround;
  var lb = run ? Math.sin(p.animT/4)*4 : 0;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(x+p.w/2,GROUND,p.w*0.7,4,0,0,7); ctx.fill();
  // Dash trail
  if (p.dashT > 0) { ctx.globalAlpha=0.3; ctx.fillStyle=PAL.light; ctx.fillRect(x-p.facing*12,y,p.w,p.h); ctx.globalAlpha=blink?0.4:1; }
  // Hakama
  ctx.fillStyle = '#306230';
  ctx.fillRect(x+4,y+28,8,18+lb); ctx.fillRect(x+p.w-12,y+28,8,18-lb);
  ctx.fillStyle = '#2a5a2a'; ctx.fillRect(x+2,y+24,p.w-4,8);
  // Gi
  ctx.fillStyle = PAL.gi; ctx.fillRect(x+4,y+10,p.w-8,16);
  ctx.fillStyle = '#d0d0c8'; ctx.fillRect(x+p.w/2-1,y+10,2,16);
  // Head
  ctx.fillStyle = PAL.skin; ctx.beginPath(); ctx.arc(x+p.w/2,y+6,8,0,7); ctx.fill();
  // Hair
  ctx.fillStyle = PAL.red;
  ctx.beginPath(); ctx.arc(x+p.w/2,y+2,9,Math.PI,0); ctx.fill();
  ctx.fillRect(x+p.w/2-f*4,y-2,f*12,6); ctx.fillRect(x+p.w/2-f*2,y-4,f*8,4);
  // Eyes
  ctx.fillStyle = '#111'; ctx.fillRect(x+p.w/2+f*2-1,y+4,2,3);
  // Scar
  ctx.strokeStyle = '#b08060'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x+p.w/2+f*4,y+6); ctx.lineTo(x+p.w/2+f*4,y+9); ctx.stroke();
  // Arm + sword
  var sx = x+p.w/2+f*6, sy = y+16;
  if (p.state === 'attack' || p.state === 'special') {
    var ap = p.stateT / (p.state==='special' ? 25 : 18);
    var sa = p.state==='special' ? -Math.PI/2+Math.PI*1.5*Math.min(ap,1) : -Math.PI/4+Math.PI*0.8*Math.min(ap,1);
    var sl = p.state==='special' ? 38 : 28;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(sa);
    ctx.fillStyle = PAL.blade; ctx.fillRect(0,-2,sl,4);
    ctx.fillStyle = '#a0b0b8'; ctx.fillRect(sl-4,-3,8,2);
    ctx.fillStyle = PAL.dark; ctx.fillRect(-10,-2,12,4);
    ctx.fillStyle = '#6a3a2a'; ctx.fillRect(-8,-3,3,6);
    ctx.restore();
    if (ap > 0.2 && ap < 0.8) {
      ctx.strokeStyle = p.state==='special' ? PAL.gold : PAL.slash;
      ctx.lineWidth = p.state==='special' ? 3 : 2;
      ctx.globalAlpha = 0.6 * (1 - Math.abs(ap-0.5)*3);
      ctx.beginPath(); ctx.arc(sx+f*20,sy-10,p.state==='special'?50:35,-0.8,0.8); ctx.stroke();
      ctx.globalAlpha = blink ? 0.4 : 1;
    }
  } else {
    ctx.fillStyle = PAL.skin; ctx.fillRect(sx-2+(f>0?2:-2),sy,5,10);
    ctx.fillStyle = PAL.blade; ctx.fillRect(sx+f*4,sy+8,3,16);
    ctx.fillStyle = PAL.dark; ctx.fillRect(sx+f*4-1,sy+6,5,4);
  }
  // Combo
  if (p.combo >= 3) {

}

// ── PARTICLES ──
function emitP(x,y,n,col,sp,life) {
  for (var i=0;i<n;i++) particles.push({x:x,y:y,vx:rnd(-sp,sp),vy:rnd(-sp,0),col:col,life:life,max:life,r:rnd(2,5)});
}
function emitF(x,y,t,c,big) { floaters.push({x:x,y:y,t:40,text:t,col:c||PAL.white,big:!!big}); }
function updateParts() {
  for (var i=particles.length-1;i>=0;i--) { var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; if (--p.life<=0) particles.splice(i,1); }
  for (var i=floaters.length-1;i>=0;i--) { var f=floaters[i]; f.y-=0.8; if (--f.t<=0) floaters.splice(i,1); }
  for (var i=0;i<pickups.length;i++) pickups[i].animT++;
}
function drawParts() {
  particles.forEach(function(p) {
    ctx.globalAlpha = clamp(p.life/p.max,0,1); ctx.fillStyle = p.col;
    ctx.fillRect(p.x-p.r/2-camX,p.y-p.r/2,p.r,p.r);
  });
  ctx.globalAlpha = 1;
  floaters.forEach(function(f) {
    ctx.globalAlpha = clamp(f.t/40,0,1);
    ctx.font = f.big ? 'bold 28px Courier New' : 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(f.text,f.x-camX+1,f.y+1);
    ctx.fillStyle = f.col; ctx.fillText(f.text,f.x-camX,f.y);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// ── HUD ──
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(14,14,200,22);
  ctx.fillStyle = PAL.hpBg; ctx.fillRect(18,18,192,14);

  ctx.strokeStyle = PAL.mid; ctx.lineWidth = 1; ctx.strokeRect(14,14,200,22);

  ctx.fillText('WAVE '+wave+'  \u2665'+lives+'  \u2605'+score,W-14,28); ctx.textAlign = 'left';
  if (player.combo >= 2) {

    ctx.fillStyle = '#c0392b'; ctx.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(bx,by,bw,12);
    ctx.fillStyle = PAL.white; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(boss.name+' HP '+Math.ceil(boss.hp)+'/'+boss.maxHp,W/2,by-4); ctx.textAlign = 'left';
  }
  if (enemies.length === 0 && typeof waveCD !== 'undefined' && waveCD !== null && !boss) {
    ctx.fillStyle = PAL.light; ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('Next wave in '+Math.ceil(waveCD/60)+'...',W/2,60); ctx.textAlign = 'left';
  }
}

// ── ACTIONS ──
function doJump() {
  if (gState !== 'play') return;
  if (player.jumps > 0) {
    player.vy = player.onGround ? -12 : -10;
    player.onGround = false; player.jumps--;
    if (player.state !== 'attack' && player.state !== 'special') player.state = 'jump';
    player.stateT = 0; Snd.jump();
    emitP(player.x+player.w/2,player.y+player.h,4,PAL.mid,2,15);
  }
}
function doAttack() {
  if (gState !== 'play') return;
  if (player.atkCD > 0 || player.state === 'special') return;
  player.state = 'attack'; player.stateT = 0; player.atkCD = 14;
  player.atkFrame = 0; player.atkHit = false; Snd.slash();
}
function doSpecial() {
  if (gState !== 'play') return;
  if (player.atkCD > 0 || player.hp < 20) return;
  player.state = 'special'; player.stateT = 0; player.atkCD = 28;
  player.atkFrame = 0; player.atkHit = false;
  player.hp = Math.max(0, player.hp - 5);
  Snd.special(); shake = 8;
  emitP(player.x+player.w/2,player.y+player.h/2,15,PAL.gold,5,25);
}
function doPause() {
  if (gState === 'play') { gState = 'pause'; Snd.pause(); }
  else if (gState === 'pause') { gState = 'play'; Snd.pause(); }
}
function getAtkHB() {
  var r = player.state==='special' ? 65 : 45;
  var h = player.state==='special' ? 50 : 35;
  return {x:player.facing>0?player.x+player.w:player.x-r, y:player.y-5, w:r, h:h};
}
function hurtPlayer(dmg) {
  if (player.invuln > 0) return;
  player.hp -= dmg; player.invuln = 40; player.state = 'hurt'; player.stateT = 0;
  player.vx = -player.facing*4; player.vy = -4; player.dmgTaken += dmg;
  Snd.hurt(); shake = Math.max(shake,5); hitFreeze = 3;
  emitP(player.x+player.w/2,player.y+player.h/2,6,PAL.red,3,18);
  emitF(player.x+player.w/2,player.y-10,'-'+dmg,PAL.red);
  if (player.hp <= 0) {
    lives--;
    if (lives <= 0) {
      gState = 'lose'; Snd.lose();
      if (score > hiScore) { hiScore = score; localStorage.setItem('kenshinHi', hiScore); }
      document.getElementById('loseSub').textContent = 'Reached wave '+wave;
      document.getElementById('loseStats').textContent = 'Score: '+score+' · Kills: '+player.kills+' · High score: '+hiScore;
      document.getElementById('loseScreen').classList.remove('hidden');
    } else {
      player.hp = player.maxHp; player.x = 120; player.y = GROUND-player.h;
      player.vx = 0; player.vy = 0; player.safeX = 120; player.safeY = GROUND-player.h; camX = 0;
    }
  }
}

// ── BOSS AI ──
function updateBoss() {
  if (!boss || boss.dead) return;
  var b = boss; b.animT++;
  if (b.hurt > 0) b.hurt--;
  if (b.atkCD > 0) b.atkCD--;
  b.facing = player.x > b.x ? 1 : -1;
  var dp = Math.abs(player.x - b.x);
  b.stateT++;
  if (b.atkCD <= 0 && dp < 70) {
    if (player.invuln <= 0 && aabb(player, {x:b.x-10,y:b.y,w:b.w+20,h:b.h})) {
      hurtPlayer(b.dmg); b.atkCD = 60; shake = 10; hitFreeze = 5;
      emitP(player.x+player.w/2,player.y+player.h/2,10,PAL.red,5,20);
    }
  } else if (dp > 70) {
    b.x += b.facing * (b.phase===1 ? 1.2 : 1.8);
  }
  if (b.hp < b.maxHp*0.5 && b.phase === 1) {
    b.phase = 2; b.spd *= 1.5;
    floaters.push({x:b.x+20,y:b.y-30,t:60,text:'ENRAGED!',col:PAL.red,big:true});
  }
  if (b.stateT % 120 === 0 && b.vy === 0) b.vy = -10;
  b.vy = clamp(b.vy + 0.65, -15, 14);
  b.x += b.vx; b.x = clamp(b.x,4,WW-b.w-4);
  b.y += b.vy;
  platforms.forEach(function(pl) {
    if (aabb(b, pl) && b.vy > 0) { b.y = pl.y - b.h; b.vy = 0; }
  });
}

// ── UPDATE ──
function update() {
  if (gState !== 'play') return;
  player.animT++;
  var left = isLeft(), right = isRight();
  if (left) { player.vx -= 0.5; player.facing = -1; }
  if (right) { player.vx += 0.5; player.facing = 1; }
  if (!left && !right) player.vx *= 0.75;
  player.vx = clamp(player.vx, -player.speed, player.speed);
  player.vy = clamp(player.vy + 0.65, -15, 14);
  // X collision
  player.x += player.vx;
  player.x = clamp(player.x, 4, WW-player.w-4);
  platforms.forEach(function(pl) {
    if (aabb(player, pl)) {
      if (player.vx > 0) player.x = pl.x - player.w;
      else if (player.vx < 0) player.x = pl.x + pl.w;
      if (!pl.float) player.vx = 0;
    }
  });
  // Y collision
  player.onGround = false;
  player.y += player.vy;
  platforms.forEach(function(pl) {
    if (aabb(player, pl)) {
      if (player.vy > 0) {
        player.y = pl.y - player.h; player.vy = 0; player.onGround = true; player.jumps = player.maxJumps;
        if (!pl.float) {
          player.safeX = clamp(player.x, pl.x, pl.x+pl.w-player.w);
          player.safeY = pl.y - player.h;
        }
      } else if (player.vy < 0) {
        player.y = pl.y + pl.h; player.vy = 0;
      }
    }
  });
  // Fell off
  if (player.y > H + 80) {
    hurtPlayer(20);
    if (player.hp > 0) { player.x = player.safeX; player.y = player.safeY; player.vx = 0; player.vy = 0; }
  }
  if (player.invuln > 0) player.invuln--;
  if (player.atkCD > 0) player.atkCD--;

  // Attack states
  if (player.state === 'attack') {
    player.stateT++; player.atkFrame++;
    if (player.atkFrame === 4 && !player.atkHit) {
      var hb = getAtkHB();
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.dead && aabb(hb, e)) {
          e.hp -= 2; e.hurt = 12; player.atkHit = true;
          player.combo++; player.comboTimer = 60; player.kills++;
          var pts = 50 * Math.max(1, Math.floor(player.combo/3)); score += pts;
          Snd.hit(); hitFreeze = 2;
          emitP(e.x+e.w/2,e.y+e.h/2,8,PAL.slash,4,20);
          emitF(e.x+e.w/2,e.y-10,'+'+pts);
          if (e.hp <= 0) {
            e.dead = true; Snd.kill();
            emitP(e.x+e.w/2,e.y+e.h/2,12,e.col,5,25);
            emitF(e.x+e.w/2,e.y-20,'DEFEAT',PAL.gold);
            if (Math.random() < 0.15) spawnPickup(e.x, e.y, 'hp');
          }
          break;
        }
      }
      if (boss && !boss.dead && aabb(hb, boss)) {
        boss.hp -= 2; boss.hurt = 12; player.atkHit = true;
        player.combo++; player.comboTimer = 60;
        Snd.hit(); hitFreeze = 3; shake = Math.max(shake,3);
        emitP(boss.x+boss.w/2,boss.y+boss.h/2,10,PAL.gold,4,20);
        if (boss.hp <= 0) {
          boss.dead = true; score += 500; Snd.kill();
          emitP(boss.x+boss.w/2,boss.y+boss.h/2,30,PAL.red,8,40);
          emitF(boss.x+boss.w/2,boss.y-20,'BOSS DEFEAT +500',PAL.gold,true);
          spawnPickup(boss.x,boss.y,'hp'); spawnPickup(boss.x+20,boss.y,'score');
          boss = null;
        }
      }
    }
    if (player.stateT >= 18) { player.state = player.onGround ? 'idle' : 'jump'; player.stateT = 0; }
  } else if (player.state === 'special') {
    player.stateT++; player.atkFrame++;
    if (player.atkFrame >= 3 && player.atkFrame <= 15 && player.atkFrame % 3 === 0) {
      var hb = getAtkHB();
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.dead && aabb(hb, e)) {
          e.hp -= 1; e.hurt = 8; Snd.hit();
          emitP(e.x+e.w/2,e.y+e.h/2,5,PAL.gold,3,15);
          if (e.hp <= 0) {
            e.dead = true; score += 100; player.kills++; Snd.kill();
            emitP(e.x+e.w/2,e.y+e.h/2,15,PAL.gold,6,30);
            emitF(e.x+e.w/2,e.y-20,'+100',PAL.gold);
          }
        }
      }
      if (boss && !boss.dead && aabb(hb, boss)) {
        boss.hp -= 1; boss.hurt = 8; Snd.hit();
        emitP(boss.x+boss.w/2,boss.y+boss.h/2,5,PAL.gold,3,15);
        if (boss.hp <= 0) {
          boss.dead = true; score += 500; Snd.kill();
          emitP(boss.x+boss.w/2,boss.y+boss.h/2,30,PAL.red,8,40);
          emitF(boss.x+boss.w/2,boss.y-20,'BOSS DEFEAT +500',PAL.gold,true);
          spawnPickup(boss.x,boss.y,'hp'); spawnPickup(boss.x+20,boss.y,'score');
          boss = null;
        }
      }
    }
    if (player.stateT >= 25) { player.state = player.onGround ? 'idle' : 'jump'; player.stateT = 0; }
  } else {
    player.state = player.onGround ? (left||right ? 'run' : 'idle') : 'jump';
    player.stateT++;
  }

  if (player.comboTimer > 0) { player.comboTimer--; if (player.comboTimer <= 0) player.combo = 0; }

  // Enemies
  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    if (e.dead) continue;
    e.animT++; if (e.hurt > 0) e.hurt--; if (e.atkCD > 0) e.atkCD--;
    e.facing = player.x > e.x ? 1 : -1;
    var dp = Math.abs(player.x - e.x);
    if (dp > e.atkRange) e.x += e.facing * e.spd * 0.6;
    else if (dp < 30) e.x -= e.facing * e.spd * 0.3;
    if (e.type === 'archer' && !e.arrowOn) {
      e.shootCD--;
      if (e.shootCD <= 0 && dp < 350) {
        e.arrowOn = true; e.arrowX = e.x+e.w/2; e.arrowY = e.y+e.h/2;
        e.arrowVx = e.facing * 4; e.shootCD = 80 + rint(0,30);
      }
    }
    if (e.arrowOn) {
      e.arrowX += e.arrowVx;
      if (e.arrowX < camX-50 || e.arrowX > camX+W+50) e.arrowOn = false;
      if (player.invuln <= 0 && dst(e.arrowX,e.arrowY,player.x+player.w/2,player.y+player.h/2) < 20) {
        hurtPlayer(e.dmg); e.arrowOn = false;
        emitP(e.arrowX,e.arrowY,4,'#8a6a3a',2,12);
      }
    }
    if (player.invuln <= 0 && e.atkCD <= 0 && aabb(player, e)) {
      hurtPlayer(e.dmg); e.atkCD = 40; player.vx = sign(player.x-e.x)*5;
    }
    e.x = clamp(e.x, 4, WW-e.w-4);
    if (e.dead) enemies.splice(i, 1);
  }

  updateBoss();

  // Pickups
  for (var i = pickups.length - 1; i >= 0; i--) {
    var pk = pickups[i];
    if (aabb(player, {x:pk.x,y:pk.y,w:pk.w,h:pk.h})) {
      if (pk.type === 'hp') { player.hp = Math.min(player.maxHp, player.hp+25); emitF(pk.x,pk.y-10,'+25 HP','#ff8888'); }
      else { score += 100; emitF(pk.x,pk.y-10,'+100',PAL.gold); }
      Snd.pickup(); pickups.splice(i, 1);
    }
  }

  // Wave management
  if (enemies.length === 0 && !boss) {
    if (waveCD === undefined || waveCD === null) waveCD = 90;
    waveCD--;
    if (waveCD <= 0) { spawnWave(); waveCD = null; }
  }

  // Camera
  var tc = clamp(player.x+player.w/2-W/2, 0, WW-W);
  camX = lerp(camX, tc, 0.1);
  if (shake > 0) shake *= 0.85; if (shake < 0.5) shake = 0;
  if (hitFreeze > 0) { hitFreeze--; return; }
  updateParts();
}

// ── DRAW ──
function draw() {
  ctx.save();
  var sx = shake ? rnd(-shake,shake) : 0, sy = shake ? rnd(-shake,shake) : 0;
  ctx.translate(sx, sy);
  drawBG();
  ctx.save(); ctx.translate(-camX, 0);
  drawPlatforms();
  drawPickups();
  enemies.forEach(function(e) { drawEnemy(e); });
  drawBoss();
  drawPlayer();
  drawParts();
  ctx.restore();
  drawHUD();
  ctx.restore();
}

// ── GAME FLOW ──
function handleStart() {
  if (gState === 'title' || gState === 'win' || gState === 'lose') startGame();
}
function startGame() {
  gState = 'play'; score = 0; wave = 0; lives = 3; camX = 0; shake = 0; hitFreeze = 0;
  particles = []; floaters = []; pickups = []; enemies = []; boss = null; waveCD = null;
  Snd.init(); player = mkPlayer(); buildLevel();
  document.getElementById('title').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('loseScreen').classList.add('hidden');
  waveCD = 60;
}

// ── MAIN LOOP ──
var last = performance.now(), acc = 0, STEP = 1000/60;
function frame(now) {
  acc += now - last; last = now; if (acc > 200) acc = 200;
  while (acc >= STEP) { update(); acc -= STEP; }
  if (gState === 'play') draw();
  else if (gState === 'title' || gState === 'pause') drawBG();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── BUTTONS ──
document.getElementById('startBtn').addEventListener('click', function(e) { e.stopPropagation(); handleStart(); });
document.getElementById('startBtn').addEventListener('touchend', function(e) { e.preventDefault(); e.stopPropagation(); handleStart(); }, {passive:false});
var wb = document.getElementById('winBtn');
if (wb) wb.addEventListener('click', function(e) { e.stopPropagation(); startGame(); });
var lb = document.getElementById('loseBtn');
if (lb) lb.addEventListener('click', function(e) { e.stopPropagation(); startGame(); });
</script>
</body>
